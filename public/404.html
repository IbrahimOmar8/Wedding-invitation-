<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Found — WedCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #faf6ef; color: #2d2a24; font-family: 'Cormorant Garamond', serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; text-align: center; }
  .wrap { max-width: 500px; }
  .num { font-family: 'Great Vibes', cursive; font-size: 8rem; color: #b78a3a; line-height: 1; }
  h1 { font-size: 1.6rem; margin: 1rem 0; font-style: italic; font-weight: 400; }
  p { color: #6b6354; margin-bottom: 2rem; font-size: 1.1rem; }
  a { display: inline-block; padding: 0.8rem 1.6rem; background: #b78a3a; color: #fff; text-decoration: none; border-radius: 4px; font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; transition: background 0.2s; }
  a:hover { background: #8a6620; }
</style>
</head>
<body>
<div class="wrap">
  <div class="num">404</div>
  <h1>Invitation Not Found</h1>
  <p>This invitation doesn't exist, or it hasn't been published yet.</p>
  <a href="/">Back to home</a>
</div>
</body>
</html>
