<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify — WedCard</title>
<link rel="stylesheet" href="/css/auth.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  .otp-input { letter-spacing: 0.5em; font-size: 1.6rem; text-align: center; font-family: 'Cormorant Garamond', monospace; }
  .resend { display: block; margin-top: 1rem; text-align: center; color: #6b6354; font-size: 0.9rem; }
  .resend button { background: none; border: none; color: #8a6620; text-decoration: underline; cursor: pointer; font-family: inherit; font-size: inherit; }
  .resend button:disabled { color: #b0a995; cursor: not-allowed; text-decoration: none; }
  .target { text-align: center; color: #8a6620; font-style: italic; font-size: 0.95rem; margin: -0.8rem 0 1.5rem; }
</style>
</head>
<body>
<div class="auth-card">
  <a href="/" class="brand">WedCard</a>
  <p class="tagline">Verify Your Account</p>
  <h1>Enter the verification code</h1>
  <p class="target" id="target">Loading…</p>

  <div class="error-box" id="err"></div>

  <form id="otp-form" autocomplete="off">
    <div class="field">
      <label>6-digit Code</label>
      <input type="text" id="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" required class="otp-input">
    </div>
    <button type="submit" class="btn" id="submit-btn">Verify &amp; Continue</button>
  </form>

  <div class="resend">
    Didn't receive it? <button id="resend-btn" type="button">Resend code</button>
  </div>
  <p class="alt-link"><a href="/signup">Back to sign up</a></p>
</div>

<script>
  const pending = (() => { try { return JSON.parse(sessionStorage.getItem('wc_pending') || '{}'); } catch (_) { return {}; } })();
  if (!pending.username || !pending.slug) { window.location.href = '/signup'; }
  document.getElementById('target').innerHTML = `We sent a code to <strong>${pending.username}</strong>`;

  document.getElementById('otp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn'); const err = document.getElementById('err');
    err.classList.remove('show'); btn.disabled = true; btn.textContent = 'Verifying…';
    try {
      const r = await fetch('/api/auth/verify-otp', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: pending.username, otp: document.getElementById('otp').value.trim(), slug: pending.slug, password: pending.password }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Verification failed');
      localStorage.setItem('wc_token', data.token);
      localStorage.setItem('wc_user', JSON.stringify(data.user));
      sessionStorage.removeItem('wc_pending');
      window.location.href = '/dashboard';
    } catch (ex) {
      err.textContent = ex.message; err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Verify & Continue';
    }
  });

  const resendBtn = document.getElementById('resend-btn');
  resendBtn.addEventListener('click', async () => {
    resendBtn.disabled = true; resendBtn.textContent = 'Sending…';
    try {
      const r = await fetch('/api/auth/resend-otp', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: pending.username }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Could not resend');
      resendBtn.textContent = 'Sent ✓';
      setTimeout(() => { resendBtn.textContent = 'Resend code'; resendBtn.disabled = false; }, 3000);
    } catch (ex) {
      document.getElementById('err').textContent = ex.message;
      document.getElementById('err').classList.add('show');
      resendBtn.disabled = false; resendBtn.textContent = 'Resend code';
    }
  });
</script>
</body>
</html>
