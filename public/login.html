<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — WedCard</title>
<link rel="stylesheet" href="/css/auth.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-card">
  <a href="/" class="brand">WedCard</a>
  <p class="tagline">Welcome Back</p>
  <h1>Sign in to your dashboard</h1>

  <div class="error-box" id="err"></div>

  <form id="login-form" autocomplete="off">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submit-btn">Sign In</button>
  </form>

  <p class="alt-link">Don't have an account? <a href="/signup">Create one</a></p>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('err');
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Signing in...';

    const body = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    };
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Login failed');
      localStorage.setItem('wc_token', data.token);
      localStorage.setItem('wc_user', JSON.stringify(data.user));
      window.location.href = '/dashboard';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
